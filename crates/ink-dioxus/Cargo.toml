[package]
name = "ink-dioxus"
version = "0.1.0"
edition.workspace = true
description = "Reusable Dioxus UI adapter for ink-rs games."
documentation = "https://docs.rs/ink-dioxus"
repository.workspace = true
keywords.workspace = true
include = ["/Cargo.toml", "/README.md", "/src/**"]

[lib]
doctest = false

[features]
default = []
web = ["dep:dioxus", "dep:gloo-timers", "dep:serde", "dep:serde_json"]

[dependencies]
ink-rs = { version = "0.1.0", path = "../..", default-features = false, features = ["full"] }
dioxus = { version = "0.7.7", features = ["web"], optional = true }
gloo-timers = { version = "0.3", features = ["futures"], optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
